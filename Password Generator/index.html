<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">  
    <title>Password Generator</title>
  </head>
  <body>
    <h2 class="day">🚀 Day 01 of 30DaysOf30Projects</h2>
    
    <div class="container">
      
      <h2><i class="fas fa-shield-alt"></i> Password Generator</h2>
      <input type="text" id="password" readonly />
      <button class="btn" onclick="generate_password()">Generate Password</button>
      
      <div class="options">
        <label><input type="checkbox" id="upper" checked /> Include Uppercase</label>
        <label><input type="checkbox" id="lower" checked /> Include Lowercase</label>
        <label><input type="checkbox" id="number" checked /> Include Numbers</label>
        <label><input type="checkbox" id="symbol" /> Include Symbols</label>
      </div>
  
      <button class="btn copy-btn" onclick="copy_password()">Copy Password <i class="fas fa-copy"></i></button>
      
    </div>
    <script src="script.js"></script>
</body>    
</html>
