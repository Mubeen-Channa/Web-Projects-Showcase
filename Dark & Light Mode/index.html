<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dark/Light Mode Switcher</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div class="theme-switch-wrapper">
    <span class="theme-label" id="theme-name">Light Mode</span>
    <label class="switch">
      <input type="checkbox" id="theme-toggle">
      <span class="slider round"><i id="theme-icon" class="fas fa-moon"></i></span>
    </label>
  </div>

  <div class="container">
    <h1>Dark - Light Theme Web App</h1>
    <p>Click the switch to toggle between Dark & Light Mode.</p>
    <p class="day" id="day">🚀 Day 03 of 30DaysOf30Projects</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
